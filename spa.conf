# spa.conf - Configuración Apache para SPA
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    
    # Directorio para WSGI
    WSGIDaemonProcess spa python-path=/var/www/html
    WSGIProcessGroup spa
    WSGIScriptAlias / /var/www/html/app.py
    
    # Servir archivos estáticos directamente
    Alias /static /var/www/html
    
    <Directory /var/www/html>
        Require all granted
        Options -Indexes
        AllowOverride None
        
        # Apache sirve archivos estáticos
        <FilesMatch "\.(css|js|jpg|jpeg|png|ico|json|html)$">
            SetHandler None
        </FilesMatch>
    </Directory>
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/spa_error.log
    CustomLog ${APACHE_LOG_DIR}/spa_access.log combined
</VirtualHost>